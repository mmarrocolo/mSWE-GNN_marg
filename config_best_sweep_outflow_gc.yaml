# Best sweep config (ffphz2b4) + Option B ghost cells
# Option B: inflow ghost cells for msk==2  [ghost -> interior]
#           outflow ghost cells for msk==3 [interior -> ghost]
# BC applied only to inflow ghost cells during training; outflow evolves freely.
#
# On hal8, before submitting:
#   1. Regenerate template (Option B is auto-detected from msk==2/3 in SFINCS map):
#        python database/create_mesh_template_marg.py \
#               --pol  <boundary.pol> --xyz <dem.xyz> \
#               --out  database/datasets/train/template_100m_inflow_outflow_gc.pkl \
#               --multiscale --num-scales 4 --sfincs <path/to/sfincs_map.nc>
#   2. python run_convert_warmstart_inflow_outflow_gc.py
#   3. sbatch MSWE_CONFIG=config_best_sweep_outflow_gc.yaml \
#             MSWE_OUTPUT=results/best_sweep_inflow_outflow_gc.h5 run_finetune_hal8.sh

dataset_parameters:
  dataset_folder    : 'database/datasets'
  temporal_res      : 60
  train_dataset_name: 'ahr_river_v03_marg_additionalsrc_velocity_100m_warmstart_inflow_outflow_gc'
  train_size        : 1
  val_prcnt         : 0
  test_dataset_name : 'ahr_river_v03_marg_additionalsrc_velocity_100m_warmstart_inflow_outflow_gc'
  seed              : 0

scalers:
  DEM_scaler        : 'standard'
  slope_scaler      : null
  area_scaler       : 'standard'
  edge_length_scaler: 'standard'
  edge_slope_scaler : null
  WD_scaler         : null
  V_scaler          : null

selected_node_features:
  slopes        : False
  slope         : False
  area          : True
  DEM           : True

selected_edge_features:
  edge_length           : True
  edge_relative_distance: False
  edge_slope            : False

temporal_dataset_parameters:
  rollout_steps : 5
  previous_t    : 3
  time_start    : 0
  time_stop     : -1

models:
  model_type              : 'MSGNN'
  hid_features            : 32
  mlp_layers              : 3
  seed                    : 666
  learned_residuals       : True
  mlp_activation          : 'prelu'
  gnn_activation          : 'tanh'
  edge_mlp                : True
  normalize               : True
  with_filter_matrix      : True
  with_gradient           : True
  with_WL                 : True
  K                       : [1, 1, 1, 5, 4, 3, 2]
  learned_pooling         : False
  skip_connections        : True

trainer_options:
  type_loss             : 'RMSE'
  only_where_water      : True
  batch_size            : 4
  conservation          : 0
  velocity_scaler       : 7
  shallow_weight        : 5
  shallow_threshold     : 0.30
  curriculum_epoch      : 15
  patience              : 300
  max_epochs            : 1000

lr_info:
  learning_rate   : 0.0005177909168244793
  weight_decay    : 0
  scheduler       : 'cosine'
  T_max           : 1000
  eta_min         : 1.0e-6
  gamma           : 0.7
  step_size       : 10

saved_model: ''
