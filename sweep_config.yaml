# W&B sweep config: calibrate K (Chebyshev/TAG hop count per scale) on the
# 3-scale multisim + multiscale-loss model, to test whether a bigger receptive
# field at the bottleneck (and/or decoder) fixes the flood-front lag seen in
# visualize_finetuned_fixed_gt_multisim_multiloss_3scales.ipynb.
#
# Run on your LOCAL machine to initialise:
#   wandb sweep sweep_config.yaml
# Then submit jobs on hal8 using run_sweep_hal8.sh.
#
# Dotted keys are reconstructed into nested dicts by fix_dict_in_config() in finetune_ahr.py.
# Everything not swept below is inherited from the --config base file.

project: mswe-gnn-ahr-K-calib-3scales
program: finetune_ahr.py
command:
  - ${env}
  - python
  - ${program}
  - --config
  - config_best_sweep_multisim_multiscale_3scales.yaml
  # no ${args}: sweep values are injected via wandb.config, not CLI flags

# Grid, not bayes: this is a calibration comparison (like the seed table), not
# a search for the single best config, so we want every preset run to completion.
method: grid
metric:
  name: val_loss
  goal: minimize

parameters:
  # K is [enc 100m, enc 500m, bottleneck 1000m, dec 500m, dec 100m].
  # Baseline (current best_sweep_multisim_multiscale_3scales) is [1,1,5,3,2].
  K:
    values:
      - [1, 1, 3, 3, 2]   
      - [1, 1, 5, 3, 2]   
      - [1, 1, 7, 3, 2]   
      - [1, 1, 9, 3, 2]   
      - [1, 1, 7, 4, 3]   
      - [1, 1, 9, 4, 3]