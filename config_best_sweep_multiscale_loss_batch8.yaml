# Linea 1 — batch-size-8 rerun, done fairly this time. The first attempt (700 epochs,
# LR unchanged; results/best_sweep_multiscale_loss_batchsize=8.h5) performed poorly:
# batch 4->8 halves the gradient steps per epoch (~28 -> ~14 on the 112-window dataset)
# and the 700-epoch budget removed another 30% -> ~9.8k total updates vs ~28k in the
# multiscale seed runs, with no LR compensation.
# This version: batch_size 8, learning_rate DOUBLED (linear scaling rule),
# max_epochs = T_max = 700. Otherwise identical to config_best_sweep_multiscale_loss.yaml
# (seed 666, multiscale loss [5,1,1,1], K = [1,1,1,5,4,3,2]).
# NOTE: this file previously specified K: 8 (8 hops/scale) — that config is preserved in
# git history and its run is results/best_sweep_multiscale_loss_K8.h5 (Jul 13, 5h).

dataset_parameters:
  dataset_folder    : 'database/datasets'
  temporal_res      : 60
  train_dataset_name: 'ahr_river_v03_marg_additionalsrc_velocity_100m_warmstart'
  train_size        : 1
  val_prcnt         : 0
  test_dataset_name : 'ahr_river_v03_marg_additionalsrc_velocity_100m_warmstart'
  seed              : 0

scalers:
  DEM_scaler        : 'standard'
  slope_scaler      : null
  area_scaler       : 'standard'
  edge_length_scaler: 'standard'
  edge_slope_scaler : null
  WD_scaler         : null
  V_scaler          : null

selected_node_features:
  slopes        : False
  slope         : False
  area          : True
  DEM           : True

selected_edge_features:
  edge_length           : True
  edge_relative_distance: False
  edge_slope            : False

temporal_dataset_parameters:
  rollout_steps : 5
  previous_t    : 3
  time_start    : 0
  time_stop     : -1

models:
  model_type              : 'MSGNN'
  hid_features            : 32
  mlp_layers              : 3
  seed                    : 666
  learned_residuals       : True
  mlp_activation          : 'prelu'
  gnn_activation          : 'tanh'
  edge_mlp                : True
  normalize               : True
  with_filter_matrix      : True
  with_gradient           : True
  with_WL                 : True
  K                       : [1,1,1,5,4,3,2]
  learned_pooling         : False
  skip_connections        : True

trainer_options:
  type_loss             : 'RMSE'
  only_where_water      : True
  batch_size            : 8
  conservation          : 0
  velocity_scaler       : 7
  shallow_weight        : 5
  shallow_threshold     : 0.30
  curriculum_epoch      : 15
  patience              : 300
  max_epochs            : 700
  multiscale_loss_scaler: [5, 1, 1, 1]

lr_info:
  learning_rate   : 0.0010355818336489586   # 2x the base LR (linear scaling for batch 4 -> 8)
  weight_decay    : 0
  scheduler       : 'cosine'
  T_max           : 700
  eta_min         : 1.0e-6
  gamma            : 0.7
  step_size       : 10

saved_model: ''
