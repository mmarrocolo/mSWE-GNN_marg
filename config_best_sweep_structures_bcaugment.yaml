# Structures (levee/thin-dam) + BC-augmentation multisim training (32 events: 12
# structure scenarios on template_100m_structures.pkl + 20 BC-magnitude/timing
# augmentation events on template_100m.pkl, all now carrying node_BC_outflow) WITH
# the multiscale loss [5,1,1,1] (finest-first). Same architecture/trainer/lr_info as
# config_best_sweep_multisim_multiscale_loss.yaml - only the dataset changed.
# Test scenario: the plain 1.0x warmstart run (never in the training mix), same
# convention as every other multisim config in this repo.
#
# 4 held-out structure generalization scenarios (bothbanks_dz10m, gap_dz5m,
# thin_dam2_dz15m, thin_dam2_dz20m) are converted but deliberately NOT part of this
# config - evaluate those individually against a trained checkpoint, not as the
# routine validation set.

dataset_parameters:
  dataset_folder    : 'database/datasets'
  temporal_res      : 60
  train_dataset_name: 'ahr_river_v03_marg_structures_bcaugment_additionalsrc_velocity_100m_warmstart_multisim'
  train_size        : 32
  val_prcnt         : 0
  test_dataset_name : 'ahr_river_v03_marg_additionalsrc_velocity_100m_warmstart'
  seed              : 0

scalers:
  DEM_scaler        : 'standard'
  slope_scaler      : null
  area_scaler       : 'standard'
  edge_length_scaler: 'standard'
  edge_slope_scaler : null
  WD_scaler         : null
  V_scaler          : null

selected_node_features:
  slopes        : False
  slope         : False
  area          : True
  DEM           : True

selected_edge_features:
  edge_length           : True
  edge_relative_distance: False
  edge_slope            : False

temporal_dataset_parameters:
  rollout_steps : 5
  previous_t    : 3
  time_start    : 0
  time_stop     : -1

models:
  model_type              : 'MSGNN'
  hid_features            : 32
  mlp_layers              : 3
  seed                    : 666
  learned_residuals       : True
  mlp_activation          : 'prelu'
  gnn_activation          : 'tanh'
  edge_mlp                : True
  normalize               : True
  with_filter_matrix      : True
  with_gradient           : True
  with_WL                 : True
  K                       : [1, 1, 1, 5, 4, 3, 2]
  learned_pooling         : False
  skip_connections        : True

trainer_options:
  type_loss             : 'RMSE'
  only_where_water      : True
  batch_size            : 8
  conservation          : 0
  velocity_scaler       : 7
  shallow_weight        : 5
  shallow_threshold     : 0.30
  curriculum_epoch      : 15
  patience              : 50
  max_epochs            : 1000
  validate_on_test      : True
  multiscale_loss_scaler: [5, 1, 1, 1]

lr_info:
  learning_rate   : 0.0005177909168244793
  weight_decay    : 0
  scheduler       : 'cosine'
  T_max           : 1000
  eta_min         : 1.0e-6
  gamma           : 0.7
  step_size       : 10

saved_model: ''
