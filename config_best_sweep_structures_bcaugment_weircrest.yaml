# Same 32-event structures+bcaugment training as config_best_sweep_structures_bcaugment.yaml,
# with one addition: selected_edge_features.edge_weir_crest turned on (edge_attr goes
# from 1-dim to 2-dim). This is a real barrier-height-above-terrain feature computed
# per dual edge from each structure scenario's own sfincs.weir file (crest elevation),
# see compute_edge_weir_crest_offset in database/convert_sfincs_to_pkl_marg.py - not
# baked into DEM, since SFINCS itself treats the weir crest as independent from bed
# level. Only present (nonzero) on the 12 structure events' finest-scale dual edges;
# 0 everywhere else, including the entirety of the 20 BC-augmentation events (they
# have no edge_weir_crest attribute at all - dataset.py's get_edge_features() falls
# back to all-zero for those, no reconversion needed for them).
#
# edge_encoder's input dim changes (1->2), so this CANNOT load
# results/best_sweep_structures_bcaugment.h5 (would architecture-mismatch) -
# saved_model stays '' (train from scratch), same as the original config was.
# That original checkpoint (and best_sweep_bcaugment.h5) are untouched by any of
# this and remain fully usable exactly as before.

dataset_parameters:
  dataset_folder    : 'database/datasets'
  temporal_res      : 60
  train_dataset_name: 'ahr_river_v03_marg_structures_bcaugment_additionalsrc_velocity_100m_warmstart_multisim'
  train_size        : 32
  val_prcnt         : 0
  test_dataset_name : 'ahr_river_v03_marg_additionalsrc_velocity_100m_warmstart'
  seed              : 0

scalers:
  DEM_scaler        : 'standard'
  slope_scaler      : null
  area_scaler       : 'standard'
  edge_length_scaler: 'standard'
  edge_slope_scaler : null
  WD_scaler         : null
  V_scaler          : null

selected_node_features:
  slopes        : False
  slope         : False
  area          : True
  DEM           : True

selected_edge_features:
  edge_length           : True
  edge_relative_distance: False
  edge_slope            : False
  edge_weir_crest        : True

temporal_dataset_parameters:
  rollout_steps : 5
  previous_t    : 3
  time_start    : 0
  time_stop     : -1

models:
  model_type              : 'MSGNN'
  hid_features            : 32
  mlp_layers              : 3
  seed                    : 666
  learned_residuals       : True
  mlp_activation          : 'prelu'
  gnn_activation          : 'tanh'
  edge_mlp                : True
  normalize               : True
  with_filter_matrix      : True
  with_gradient           : True
  with_WL                 : True
  K                       : [1, 1, 1, 5, 4, 3, 2]
  learned_pooling         : False
  skip_connections        : True

trainer_options:
  type_loss             : 'RMSE'
  only_where_water      : True
  batch_size            : 8
  conservation          : 0
  velocity_scaler       : 7
  shallow_weight        : 5
  shallow_threshold     : 0.30
  curriculum_epoch      : 15
  patience              : 200
  max_epochs            : 1000
  validate_on_test      : True
  multiscale_loss_scaler: [5, 1, 1, 1]

lr_info:
  learning_rate   : 0.0005177909168244793
  weight_decay    : 0
  scheduler       : 'cosine'
  T_max           : 1000
  eta_min         : 1.0e-6
  gamma           : 0.7
  step_size       : 10

saved_model: ''
